<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Formulário</title>

    <link rel="stylesheet" href="style.css">

    <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">
</head>

<body>

    <a href="https://mangadex.org/title/a77742b1-befd-49a4-bff5-1ad4e6b0ef7b?page=2"
        class="btn btn-primary">
        Ver projetos
    </a>

    <input type="text" class="form-control">

    <textarea class="form-control" rows="4">Digite</textarea>

    <form class="needs-validation" novalidate>

        <!-- E-mail -->
        <label for="email" class="form-label">
            E-mail
        </label>

        <input type="email"
            class="form-control"
            id="email"
            required>

        <div class="invalid-feedback">
            Informe um email válido.
        </div>

        <div class="valid-feedback">
            Ficou bom!
        </div>


        <!-- Motivo -->
        <label for="motivo" class="form-label mt-3">
            Motivo
        </label>

        <select class="form-control" id="motivo" required>

            <option value="">
                Escolha uma opção
            </option>

            <option value="duvida">
                Dúvida
            </option>

            <option value="sugestao">
                Sugestão
            </option>

            <option value="problema">
                Problema
            </option>

        </select>

        <div class="invalid-feedback">
            Escolha um motivo.
        </div>


        <!-- Termos -->
        <div class="form-check mt-3">

            <input class="form-check-input"
                type="checkbox"
                id="aceito"
                required>

            <label class="form-check-label" for="aceito">
                Aceito os termos
            </label>

            <div class="invalid-feedback">
                Você precisa aceitar os termos.
            </div>

        </div>


        <!-- Botão -->
        <button class="btn btn-primary mt-3"
            type="submit">
            Enviar
        </button>

        <div class="input-group">
            <span class="input-group-text">@</span>
            <input type="email" class="form-control">
        </div>


    <input class="form-control form-control-lg">
    <button class="btn btn-outline-primary">Limpar</button>

    <div class="col-12 col-md-6 col-lg-4"></div>
    </form>


    <script>

        const form = document.querySelector('.needs-validation');

        form.addEventListener('submit', function(event) {

            event.preventDefault();

            if (!form.checkValidity()) {

                event.stopPropagation();

            } else {

                alert('Formulário enviado com sucesso!');

            }

            form.classList.add('was-validated');

        });

    </script>

</body>

</html>
