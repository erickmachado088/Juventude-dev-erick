<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>frontend-quiz</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Rubik:ital,wght@0,300..900;1,300..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">  
</head>
<body class="d-flex flex-column justify-content-between p-3 p-md-5">
    <main
    class="container py-5 text-white rounded-4 shadow"
    style="background-color: rgba(55, 115, 192, 0.664);"
>

  <div class="row align-items-start g-5">

    <!-- ESQUERDA -->
    <div class="col-md-4">
      <article class="card card-esquerda bg-transparent text-white border-0">
        <div class="card-body">
          <h1 class="card-title">Welcome to the</h1>
          <h1 class="card-text">
            <strong>Frontend Quiz!</strong>
          </h1>
        </div>
      </article>
    </div>

    <!-- DIREITA -->
    <div class="col-md-8">
      <div class="d-flex flex-column align-items-center gap-4">

        <article class="card card-direita bg-transparent text-white border-0 w-75">
          <div class="card-body d-flex align-items-center gap-3">
            <i class="bi bi-filetype-html fs-2 text-warning"></i>
            <h2 class="m-0">HTML</h2>
          </div>
        </article>

        <article class="card card-direita bg-transparent text-white border-0 w-75">
        <div class="card-body d-flex align-items-center gap-3">
            <i class="bi bi-filetype-css fs-2 text-info"></i>
            <h2 class="m-0">CSS</h2>
        </div>
        </article>

        
        <article class="card card-direita bg-transparent text-white border-0 w-75">
        <div class="card-body d-flex align-items-center gap-3">
            <i class="bi bi-filetype-js fs-2 text-warning"></i>
            <h2 class="m-0">JavaScript</h2>
        </div>
        </article>

        <article class="card card-direita bg-transparent text-white border-0 w-75">
        <div class="card-body d-flex align-items-center gap-3">
            <i class="bi bi-universal-access fs-2 text-info"></i>
            <h2 class="m-0">Acessibilidade</h2>
        </div>
        </article>

      </div>
    </div>

  </div>

</main>

</body>
</html>
